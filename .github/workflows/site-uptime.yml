name: Site uptime

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Curl production homepage
        run: |
          set -e
          code=$(curl -sI -o /dev/null -w "%{http_code}" --max-time 20 https://biswajitpowerhub.in/)
          echo "apex status=$code"
          test "$code" = "200"
          title=$(curl -s --max-time 20 https://biswajitpowerhub.in/ | grep -oP '(?<=<title>)[^<]+' | head -1)
          echo "title=$title"
          echo "$title" | grep -qi Berhampore
